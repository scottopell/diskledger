[package]
name = "diskledger"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/scottopell/diskledger"
description = "Directory-size ledger for macOS/APFS: checkpoints, diffs, and kernel dir-stats flagging"

[dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
