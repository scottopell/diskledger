name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The kernel interface is macOS-only, so there is nothing to build elsewhere.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: cargo test --release --locked
